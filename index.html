    <script>
      (function() {
        try {
          var saved = localStorage.getItem("bharatx-theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            // Default to premium dark mode like RIL
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
